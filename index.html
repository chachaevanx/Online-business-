<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHACH WEB SOLUTION | M-Pesa Express Checkout</title>
    <style>
        :root {
            --primary-color: #008751;
            --primary-hover: #006b40;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --error-color: #d9534f;
            --success-color: #5cb85c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccd1d1;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 135, 81, 0.15);
        }

        .hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #a3c9b7;
            cursor: not-allowed;
        }

        #statusBox {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            display: none;
            line-height: 1.4;
        }

        .status-loading {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            display: block !important;
        }

        .status-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block !important;
        }

        .status-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block !important;
        }

        .footer-note {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>CHACH WEB SOLUTION</h1>
            <p>Secure M-Pesa Express Checkout</p>
        </div>

        <form id="checkoutForm">
            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" id="phoneNumber" placeholder="e.g. 2547XXXXXXXX" required pattern="^(2547|07)\d{8}$">
                <div class="hint">Format: 2547XXXXXXXX or 07XXXXXXXX</div>
            </div>

            <div class="form-group">
                <label for="amount">Amount (KES)</label>
                <input type="number" id="amount" placeholder="Enter amount" min="1" required>
            </div>

            <button type="submit" id="payButton">Pay with M-Pesa</button>
        </form>

        <div id="statusBox"></div>

        <div class="footer-note">
            Powered by Safaricom Daraja API
        </div>
    </div>

    <script>
        const form = document.getElementById('checkoutForm');
        const payButton = document.getElementById('payButton');
        const statusBox = document.getElementById('statusBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            let phoneInput = document.getElementById('phoneNumber').value.trim();
            const amount = document.getElementById('amount').value.trim();

            // Normalize phone number to 2547XXXXXXXX format if it starts with 07
            if (phoneInput.startsWith('07')) {
                phoneInput = '254' + phoneInput.slice(1);
            }

            // Update UI to loading state
            payButton.disabled = true;
            payButton.innerText = "Processing...";
            statusBox.className = "status-loading";
            statusBox.innerText = "Initiating STK Push. Please check your phone for the M-Pesa prompt...";

            try {
                // Connects to your backend endpoint created earlier
                const response = await fetch('http://localhost:3000/api/v1/stkpush', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        phoneNumber: phoneInput,
                        amount: amount
                    })
                });

                const result = await response.json();

                if (result.success) {
                    statusBox.className = "status-success";
                    statusBox.innerText = "STK Push sent successfully! Enter your M-Pesa PIN on your phone to complete the transaction.";
                } else {
                    statusBox.className = "status-error";
                    statusBox.innerText = "Failed: " + (result.error?.errorMessage || result.message || "Could not process payment.");
                }
            } catch (error) {
                statusBox.className = "status-error";
                statusBox.innerText = "Network error: Make sure your backend server is running.";
            } finally {
                payButton.disabled = false;
                payButton.innerText = "Pay with M-Pesa";
            }
        });
    </script>
</body>
</html>
